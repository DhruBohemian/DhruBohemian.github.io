backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "writings"
    label: "My Writings"
    folder: "writings"
    create: true
    slug: "{{slug}}"

    fields:

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"

      - label: "Writing"
        name: "body"
        widget: "markdown"
