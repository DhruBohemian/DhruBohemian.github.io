<head>

```
<meta charset="UTF-8">

<meta name="description" content="DhruBohemian — Words, thoughts, stories and reflections.">

<style>

    .article-page {
        max-width: 850px;
        margin: auto;
        padding: 100px 25px;
    }

    .article-category {
        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 4px;
        color: #8b5e3c;
        margin-bottom: 20px;
        text-transform: uppercase;
    }

    .article-page h1 {
        font-size: clamp(42px, 7vw, 76px);
        line-height: 1.2;
        font-weight: normal;
        margin-bottom: 25px;
    }

    .article-date {
        color: #888;
        font-family: Arial, sans-serif;
        font-size: 13px;
        margin-bottom: 60px;
    }

    .article-content {
        font-family: "Noto Serif Bengali", "Nirmala UI", serif;
        font-size: 20px;
        line-height: 2;
        color: #333;
    }

    .article-content p {
        margin-bottom: 30px;
    }

    .article-content h2,
    .article-content h3 {
        margin-top: 45px;
        margin-bottom: 20px;
        line-height: 1.4;
    }

    .article-content blockquote {
        border-left: 3px solid #8b5e3c;
        padding-left: 20px;
        margin: 30px 0;
        color: #666;
    }

    .article-content img {
        max-width: 100%;
        height: auto;
    }

    .back-button {
        display: inline-block;
        margin-bottom: 60px;
        text-decoration: none;
        color: #555;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    .back-button:hover {
        color: #8b5e3c;
    }

    .loading {
        color: #888;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    .error-message {
        color: #888;
        font-family: Arial, sans-serif;
        line-height: 1.8;
    }

</style>
```

</head>

<body>

```
<!-- Navigation -->

<header class="navbar">

    <div class="logo">
        DhruBohemian
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="index.html#writings">Writings</a>

        <a href="index.html#about">About</a>

        <a href="index.html#contact">Contact</a>

    </nav>

</header>



<!-- Article -->

<main class="article-page">

    <a href="index.html#writings" class="back-button">
        ← Back to Writings
    </a>


    <p class="article-category" id="article-category">
        LOADING
    </p>


    <h1 id="article-title">
        Loading...
    </h1>


    <p class="article-date" id="article-date"></p>


    <div class="article-content" id="article-content">

        <p class="loading">
            Loading writing...
        </p>

    </div>

</main>



<!-- Footer -->

<footer>

    <p>
        © 2026 DhruBohemian
    </p>

    <p>
        Written with curiosity.
    </p>

</footer>



<!-- Markdown parser -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


<!-- CMS Article Loader -->

<script>

    const owner = "DhruBohemian";

    const repo = "DhruBohemian.github.io";

    const branch = "main";


    function getPostName() {

        const params = new URLSearchParams(window.location.search);

        return params.get("post");

    }


    function getFrontMatterValue(frontMatter, key) {

        const regex = new RegExp(
            "^" + key + ":\\s*[\"']?(.*?)\\s*[\"']?\\s*$",
            "mi"
        );

        const match = frontMatter.match(regex);

        return match ? match[1].trim() : "";

    }


    async function loadArticle() {

        const postName = getPostName();

        const titleElement =
            document.getElementById("article-title");

        const categoryElement =
            document.getElementById("article-category");

        const dateElement =
            document.getElementById("article-date");

        const contentElement =
            document.getElementById("article-content");


        if (!postName) {

            titleElement.textContent =
                "No writing selected";

            categoryElement.textContent =
                "ERROR";

            contentElement.innerHTML = `
                <p class="error-message">
                    No article was selected.
                    Please return to the writings archive.
                </p>
            `;

            return;

        }


        try {

            const url =
                `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/writings/${encodeURIComponent(postName)}`;


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Could not load the writing."
                );

            }


            const markdown =
                await response.text();


            const parts =
                markdown.split("---");


            if (parts.length < 3) {

                throw new Error(
                    "Invalid writing format."
                );

            }


            const frontMatter =
                parts[1];

            const body =
                parts.slice(2).join("---").trim();


            const title =
                getFrontMatterValue(
                    frontMatter,
                    "title"
                );


            const category =
                getFrontMatterValue(
                    frontMatter,
                    "category"
                );


            const date =
                getFrontMatterValue(
                    frontMatter,
                    "date"
                );


            titleElement.textContent =
                title || "Untitled";


            categoryElement.textContent =
                category || "WRITING";


            if (date) {

                const parsedDate =
                    new Date(date);

                if (!isNaN(parsedDate)) {

                    dateElement.textContent =
                        parsedDate.toLocaleDateString(
                            "en-US",
                            {
                                year: "numeric",
                                month: "long",
                                day: "numeric"
                            }
                        );

                } else {

                    dateElement.textContent =
                        date;

                }

            }


            contentElement.innerHTML =
                marked.parse(body);


            document.title =
                `${title || "Writing"} | DhruBohemian`;

        }


        catch (error) {

            console.error(error);


            titleElement.textContent =
                "Unable to load writing";

            categoryElement.textContent =
                "ERROR";

            contentElement.innerHTML = `
                <p class="error-message">
                    The writing could not be loaded.
                    Please try again later.
                </p>
            `;

        }

    }


    loadArticle();

</script>
```
