<head>

    <style>

        /* =========================================
           ARTICLE PAGE
        ========================================= */

        :root {
            --article-accent: #8b5e3c;
            --article-muted: #888;
            --article-text: #303030;
            --article-bg: #f8f6f2;
        }


        body {
            background: var(--article-bg);
        }


        /* =========================================
           READING PROGRESS
        ========================================= */

        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: var(--article-accent);
            z-index: 9999;
            transition: width 0.1s linear;
        }


        /* =========================================
           ARTICLE HERO
        ========================================= */

        .article-hero {

            max-width: 1050px;

            margin: auto;

            padding:
                110px
                30px
                70px;

        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            text-decoration: none;

            color: #777;

            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 0.5px;

            margin-bottom: 75px;

            transition:
                transform 0.3s ease,
                color 0.3s ease;

        }


        .back-button:hover {

            color: var(--article-accent);

            transform: translateX(-4px);

        }


        .article-category {

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 4px;

            color: var(--article-accent);

            text-transform: uppercase;

            margin-bottom: 25px;

            opacity: 0;

            animation: articleFadeUp 0.9s
                cubic-bezier(.16,1,.3,1)
                0.05s forwards;

        }


        .article-title {

            max-width: 950px;

            margin: 0;

            font-family:
                "Noto Serif Bengali",
                Georgia,
                serif;

            font-size:
                clamp(42px, 7vw, 86px);

            line-height: 1.16;

            font-weight: 400;

            letter-spacing: -1.5px;

            color: #222;

            opacity: 0;

            animation: articleFadeUp 1s
                cubic-bezier(.16,1,.3,1)
                0.15s forwards;

        }


        .article-meta {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 30px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            color: var(--article-muted);

            opacity: 0;

            animation: articleFadeUp 1s
                cubic-bezier(.16,1,.3,1)
                0.25s forwards;

        }


        .meta-dot {
            opacity: 0.5;
        }


        /* =========================================
           ARTICLE CONTENT
        ========================================= */

        .article-wrapper {

            max-width: 760px;

            margin: auto;

            padding:
                20px 30px
                110px;

        }


        .article-content {

            font-family:
                "Noto Serif Bengali",
                "Nirmala UI",
                serif;

            font-size:
                clamp(18px, 2vw, 21px);

            line-height: 2.05;

            color: var(--article-text);

        }


        .article-content p {

            margin:
                0 0 32px;

        }


        .article-content h2 {

            font-size:
                clamp(28px, 4vw, 40px);

            font-weight: 500;

            line-height: 1.45;

            margin:
                65px 0 25px;

            color: #222;

        }


        .article-content h3 {

            font-size: 28px;

            font-weight: 500;

            margin:
                50px 0 20px;

        }


        .article-content strong {

            font-weight: 700;

            color: #222;

        }


        .article-content em {

            color: #555;

        }


        .article-content blockquote {

            margin:
                50px 0;

            padding:
                25px 30px;

            border-left:
                3px solid var(--article-accent);

            background: rgba(139, 94, 60, 0.045);

            color: #555;

            font-size: 1.05em;

        }


        .article-content ul,
        .article-content ol {

            margin:
                25px 0 35px;

            padding-left: 35px;

        }


        .article-content li {

            margin-bottom: 12px;

        }


        .article-content a {

            color: var(--article-accent);

        }


        .article-content img {

            display: block;

            max-width: 100%;

            height: auto;

            margin:
                45px auto;

        }


        .article-content hr {

            border: 0;

            border-top:
                1px solid rgba(0,0,0,0.1);

            margin:
                60px 0;

        }


        /* =========================================
           ARTICLE FOOTER ACTIONS
        ========================================= */

        .article-actions {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 80px;

            padding-top: 35px;

            border-top:
                1px solid rgba(0,0,0,0.1);

        }


        .article-action-button {

            border: 0;

            background: transparent;

            padding: 10px 0;

            color: #555;

            font-family: Arial, sans-serif;

            font-size: 13px;

            cursor: pointer;

            transition:
                color 0.3s ease,
                transform 0.3s ease;

        }


        .article-action-button:hover {

            color: var(--article-accent);

        }


        .share-button:hover {

            transform: translateY(-2px);

        }


        /* =========================================
           PREVIOUS / NEXT
        ========================================= */

        .article-navigation {

            max-width: 1050px;

            margin: auto;

            padding:
                0 30px 100px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 25px;

        }


        .nav-card {

            display: block;

            text-decoration: none;

            padding: 30px;

            border:
                1px solid rgba(0,0,0,0.09);

            background: rgba(255,255,255,0.35);

            transition:
                transform 0.4s
                    cubic-bezier(.16,1,.3,1),
                border-color 0.3s ease;

        }


        .nav-card:hover {

            transform: translateY(-5px);

            border-color:
                rgba(139,94,60,0.35);

        }


        .nav-label {

            display: block;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            color: var(--article-accent);

            margin-bottom: 15px;

        }


        .nav-title {

            display: block;

            font-family:
                "Noto Serif Bengali",
                serif;

            font-size: 20px;

            line-height: 1.5;

            color: #333;

        }


        .next-card {

            text-align: right;

        }


        /* =========================================
           LOADING / ERROR
        ========================================= */

        .loading,
        .error-message {

            color: #888;

            font-family: Arial, sans-serif;

            font-size: 14px;

            line-height: 1.8;

        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes articleFadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(30px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .article-hero {

                padding:
                    75px
                    22px
                    50px;

            }


            .back-button {

                margin-bottom: 50px;

            }


            .article-title {

                letter-spacing: -0.8px;

            }


            .article-meta {

                margin-top: 22px;

            }


            .article-wrapper {

                padding:
                    10px
                    22px
                    80px;

            }


            .article-content {

                font-size: 18px;

                line-height: 1.95;

            }


            .article-content p {

                margin-bottom: 27px;

            }


            .article-content h2 {

                margin-top: 50px;

            }


            .article-navigation {

                grid-template-columns: 1fr;

                padding:
                    0 22px 70px;

            }


            .next-card {

                text-align: left;

            }


            .article-actions {

                margin-top: 60px;

            }

        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .article-category,
            .article-title,
            .article-meta {

                opacity: 1;

                animation: none;

            }

            * {

                scroll-behavior: auto !important;

            }

        }

    </style>

</head>


<body>

    <!-- Markdown parser -->

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>



    <script>

        /* =========================================
           CONFIG
        ========================================= */

        const owner =
            "DhruBohemian";

        const repo =
            "DhruBohemian.github.io";

        const branch =
            "main";


        /* =========================================
           ALL WRITINGS
        ========================================= */

        const writings = [

            "a-mystery-called-human.md",

            "je-ovab-peyechi-ta-jeno-uttoradhikar-na-hoy.md",

            "microplastics-the-invisible-threat-inside-the-human-body.md",

            "অ্যান্টিবায়োটিক-রেজিস্ট্যান্স-যে-নীরব-সংকট-আমাদের-ভবিষ্যৎকে-হুমকির-মুখে-ফেলছে.md",

            "ফুলের-মতো-নারী.md",

            "ekto-proshongsha-ekto-bhalo-thaka.md",

            "জেনে-গেলে-মানতে-হবে.md"

        ];


        /* =========================================
           GET CURRENT POST
        ========================================= */

        function getPostName() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("post");

        }


        /* =========================================
           FRONTMATTER
        ========================================= */

        function getFrontMatter(markdown) {

            const match =
                markdown.match(
                    /^\s*---\s*([\s\S]*?)\s*---/
                );

            if (!match) {

                return {
                    frontMatter: "",
                    body: markdown.trim()
                };

            }

            return {

                frontMatter: match[1],

                body:
                    markdown
                        .slice(match[0].length)
                        .trim()

            };

        }


        function getFrontMatterValue(
            frontMatter,
            key
        ) {

            const regex =
                new RegExp(
                    "^" +
                    key +
                    ":\\s*[\"']?(.*?)\\s*[\"']?\\s*$",
                    "mi"
                );

            const match =
                frontMatter.match(regex);

            return match
                ? match[1].trim()
                : "";

        }


        /* =========================================
           READING TIME
        ========================================= */

        function calculateReadingTime(text) {

            const cleanText =
                text
                    .replace(/[#*_>`~-]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();

            const words =
                cleanText.split(/\s+/).length;

            const wordsPerMinute = 180;

            return Math.max(
                1,
                Math.ceil(words / wordsPerMinute)
            );

        }


        /* =========================================
           LOAD ARTICLE
        ========================================= */

        async function loadArticle() {

            const postName =
                getPostName();


            const titleElement =
                document.getElementById(
                    "article-title"
                );

            const categoryElement =
                document.getElementById(
                    "article-category"
                );

            const dateElement =
                document.getElementById(
                    "article-date"
                );

            const metaDot =
                document.getElementById(
                    "meta-dot"
                );

            const readingTimeElement =
                document.getElementById(
                    "reading-time"
                );

            const contentElement =
                document.getElementById(
                    "article-content"
                );


            if (!postName) {

                titleElement.textContent =
                    "No writing selected";

                categoryElement.textContent =
                    "ERROR";

                contentElement.innerHTML = `
                    <p class="error-message">
                        No article was selected.
                        Please return to the writings archive.
                    </p>
                `;

                return;

            }


            try {

                const url =
                    `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/writings/${encodeURIComponent(postName)}`;


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        `Could not load writing: ${response.status}`
                    );

                }


                const markdown =
                    await response.text();


                const {
                    frontMatter,
                    body
                } =
                    getFrontMatter(markdown);


                const title =
                    getFrontMatterValue(
                        frontMatter,
                        "title"
                    );


                const category =
                    getFrontMatterValue(
                        frontMatter,
                        "category"
                    );


                const date =
                    getFrontMatterValue(
                        frontMatter,
                        "date"
                    );


                titleElement.textContent =
                    title || "Untitled";


                categoryElement.textContent =
                    category || "WRITING";


                /* Date */

                if (date) {

                    const parsedDate =
                        new Date(date);


                    if (!isNaN(parsedDate)) {

                        dateElement.textContent =
                            parsedDate.toLocaleDateString(
                                "en-US",
                                {
                                    year: "numeric",
                                    month: "long",
                                    day: "numeric"
                                }
                            );

                    } else {

                        dateElement.textContent =
                            date;

                    }

                } else {

                    dateElement.textContent =
                        "DhruBohemian";

                    metaDot.style.display =
                        "inline";

                }


                /* Reading time */

                const minutes =
                    calculateReadingTime(body);


                readingTimeElement.textContent =
                    `${minutes} min read`;


                /* Markdown */

                contentElement.innerHTML =
                    marked.parse(body);


                /* Page title */

                document.title =
                    `${title || "Writing"} | DhruBohemian`;


                /* Navigation */

                createArticleNavigation(
                    postName
                );


                /* Scroll reveal for content */

                setTimeout(() => {

                    contentElement.style.opacity =
                        "1";

                }, 100);


            }

            catch (error) {

                console.error(
                    "ARTICLE ERROR:",
                    error
                );


                titleElement.textContent =
                    "Unable to load writing";

                categoryElement.textContent =
                    "ERROR";


                contentElement.innerHTML = `
                    <p class="error-message">
                        The writing could not be loaded.
                        Please try again later.
                    </p>
                `;

            }

        }


        /* =========================================
           PREVIOUS / NEXT
        ========================================= */

        function createArticleNavigation(
            currentPost
        ) {

            const navigation =
                document.getElementById(
                    "article-navigation"
                );


            const currentIndex =
                writings.indexOf(
                    currentPost
                );


            if (currentIndex === -1) {

                return;

            }


            const previous =
                writings[currentIndex - 1];

            const next =
                writings[currentIndex + 1];


            let html = "";


            if (previous) {

                html += `
                    <a
                        href="article.html?post=${encodeURIComponent(previous)}"
                        class="nav-card">

                        <span class="nav-label">
                            ← Previous
                        </span>

                        <span
                            class="nav-title"
                            data-nav-post="${encodeURIComponent(previous)}">

                            Loading...

                        </span>

                    </a>
                `;

            }


            if (next) {

                html += `
                    <a
                        href="article.html?post=${encodeURIComponent(next)}"
                        class="nav-card next-card">

                        <span class="nav-label">
                            Next →
                        </span>

                        <span
                            class="nav-title"
                            data-nav-post="${encodeURIComponent(next)}">

                            Loading...

                        </span>

                    </a>
                `;

            }


            navigation.innerHTML =
                html;


            loadNavigationTitles();

        }


        async function loadNavigationTitles() {

            const elements =
                document.querySelectorAll(
                    "[data-nav-post]"
                );


            for (const element of elements) {

                const filename =
                    decodeURIComponent(
                        element.dataset.navPost
                    );


                try {

                    const url =
                        `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/writings/${encodeURIComponent(filename)}`;


                    const response =
                        await fetch(url);


                    if (!response.ok) {

                        element.textContent =
                            "Writing";

                        continue;

                    }


                    const markdown =
                        await response.text();


                    const {
                        frontMatter
                    } =
                        getFrontMatter(markdown);


                    const title =
                        getFrontMatterValue(
                            frontMatter,
                            "title"
                        );


                    element.textContent =
                        title || "Writing";

                }

                catch {

                    element.textContent =
                        "Writing";

                }

            }

        }


        /* =========================================
           SHARE
        ========================================= */

        document
            .getElementById("share-button")
            .addEventListener(
                "click",
                async () => {

                    const shareData = {

                        title:
                            document.title,

                        url:
                            window.location.href

                    };


                    try {

                        if (
                            navigator.share
                        ) {

                            await navigator.share(
                                shareData
                            );

                        } else {

                            await navigator.clipboard.writeText(
                                window.location.href
                            );

                            alert(
                                "Article link copied!"
                            );

                        }

                    }

                    catch (error) {

                        console.log(
                            "Share cancelled."
                        );

                    }

                }
            );


        /* =========================================
           READING PROGRESS
        ========================================= */

        function updateReadingProgress() {

            const progress =
                document.getElementById(
                    "reading-progress"
                );


            const scrollTop =
                window.scrollY;


            const documentHeight =
                document.documentElement.scrollHeight -
                window.innerHeight;


            if (documentHeight <= 0) {

                progress.style.width =
                    "0%";

                return;

            }


            const percentage =
                (
                    scrollTop /
                    documentHeight
                ) * 100;


            progress.style.width =
                `${Math.min(
                    100,
                    Math.max(0, percentage)
                )}%`;

        }


        window.addEventListener(
            "scroll",
            updateReadingProgress,
            {
                passive: true
            }
        );


        /* =========================================
           START
        ========================================= */

        loadArticle();

    </script>


</body>
